version: "3.8"

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: redblue-juice-shop
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - arena-net

  proxy:
    build: .
    container_name: redblue-proxy
    restart: unless-stopped
    depends_on:
      - juice-shop
    environment:
      - JUICE_SHOP_TARGET=http://juice-shop:3000
      - PORT=4000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MATCH_ID_HEADER=x-match-id
    ports:
      - "4000:4000"   # only the proxy is exposed publicly
    networks:
      - arena-net

networks:
  arena-net:
    driver: bridge
